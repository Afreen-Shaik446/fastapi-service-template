apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-service
  annotations:
    # Example for ingress-nginx; adjust for your controller.
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com # <-- replace with your real host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-service
                port:
                  number: 80
